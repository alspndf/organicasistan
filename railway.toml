[build]
builder = "NIXPACKS"
buildCommand = "cd web && npm install --legacy-peer-deps && npm run build && cd ../bot && npm install --legacy-peer-deps"

[deploy]
startCommand = "cd web && npm run start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
